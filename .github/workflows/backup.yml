name: Daily Cross-Region Backup

on:
  schedule:
    # 2:00 AM Singapore Time (UTC+8) corresponds to 18:00 (6:00 PM) UTC the previous day
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 # Primary region

      - name: Backup Database from EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_DB_NAME: ${{ secrets.RDS_DB_NAME || 'quickspace_db' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RDS_HOST,RDS_USER,RDS_PASSWORD,RDS_DB_NAME
          script: |
            echo "Starting database backup process..."
            
            if [ -z "$RDS_HOST" ]; then
              echo "Error: RDS_HOST is empty. Please add RDS_HOST to your GitHub Secrets."
              exit 1
            fi
            
            # Create a backup directory if it doesn't exist
            mkdir -p ~/backups
            
            # Format timestamp for filename
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            BACKUP_FILE="$HOME/backups/db_backup_$TIMESTAMP.sql"
            
            echo "Dumping database $RDS_DB_NAME from AWS RDS Host: $RDS_HOST..."
            # Note: We omit the space between -p and the password per mysqldump syntax
            mysqldump --protocol=tcp -h "$RDS_HOST" -u "$RDS_USER" -p"$RDS_PASSWORD" "$RDS_DB_NAME" > "$BACKUP_FILE"
            
            if [ $? -ne 0 ]; then
              echo "Error: mysqldump failed."
              exit 1
            fi
            
            echo "Uploading backup to S3 bucket ${{ secrets.BACKUP_S3_BUCKET_NAME }} in region ${{ secrets.BACKUP_AWS_REGION }}..."
            aws s3 cp "$BACKUP_FILE" "s3://${{ secrets.BACKUP_S3_BUCKET_NAME }}/db-backups/db_backup_$TIMESTAMP.sql" --region "${{ secrets.BACKUP_AWS_REGION }}"
            
            if [ $? -ne 0 ]; then
              echo "Error: Failed to upload database backup to S3."
              exit 1
            fi
            
            # Clean up old local backups (keep last 7 days)
            echo "Cleaning up local backups older than 7 days..."
            find ~/backups -type f -name "*.sql" -mtime +7 -delete
            
            echo "Database backup completed successfully."

      - name: Sync Primary S3 Bucket to Backup Bucket
        run: |
          echo "Starting S3 bucket sync process..."
          
          # Fetch the source bucket name from AWS Secrets Manager
          SOURCE_BUCKET=$(aws secretsmanager get-secret-value --secret-id "${{ secrets.AWS_SECRET_NAME }}" --region ap-south-1 --query SecretString --output text | jq -r '.AWS_S3_BUCKET_NAME')
          
          if [ -z "$SOURCE_BUCKET" ] || [ "$SOURCE_BUCKET" == "null" ]; then
            echo "Error: Could not retrieve AWS_S3_BUCKET_NAME from secrets manager."
            exit 1
          fi
          
          echo "Syncing S3 bucket $SOURCE_BUCKET to backup bucket ${{ secrets.BACKUP_S3_BUCKET_NAME }}..."
          
          # Sync from Source Bucket to Destination Bucket directly
          # Using --source-region to ensure AWS correctly resolves the primary bucket
          aws s3 sync "s3://$SOURCE_BUCKET" "s3://${{ secrets.BACKUP_S3_BUCKET_NAME }}/s3-backups/" --region "${{ secrets.BACKUP_AWS_REGION }}" --source-region ap-south-1
          
          echo "S3 bucket sync completed successfully."
