name: Daily Cross-Region Backup

on:
  schedule:
    # 2:00 AM Singapore Time (UTC+8) corresponds to 18:00 (6:00 PM) UTC the previous day
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 # Primary region

      - name: Backup Database via SSH Tunnel
        env:
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_DB_NAME: ${{ secrets.RDS_DB_NAME || 'quickspace_db' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET_NAME }}
          BACKUP_REGION: ${{ secrets.BACKUP_AWS_REGION }}
        run: |
          if [ -z "$RDS_HOST" ]; then
            echo "Error: RDS_HOST is empty. Please add RDS_HOST to your GitHub Secrets."
            exit 1
          fi
          
          echo "Setting up SSH key..."
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          
          echo "Establishing SSH tunnel to RDS instance through EC2..."
          ssh -i ~/.ssh/id_rsa -f -N -L 3307:"$RDS_HOST":3306 "$EC2_USERNAME"@"$EC2_HOST"
          
          echo "Installing mysql-client on GitHub runner..."
          sudo apt-get update && sudo apt-get install -y mysql-client
          
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE="db_backup_$TIMESTAMP.sql"
          
          echo "Dumping database $RDS_DB_NAME..."
          # Connect to the local port 3307 which is tunneled to the RDS instance
          mysqldump --protocol=tcp -h 127.0.0.1 -P 3307 -u "$RDS_USER" -p"$RDS_PASSWORD" "$RDS_DB_NAME" > "$BACKUP_FILE"
          
          if [ $? -ne 0 ]; then
            echo "Error: mysqldump failed."
            exit 1
          fi
          
          echo "Uploading backup to S3 bucket $BACKUP_S3_BUCKET in region $BACKUP_REGION..."
          # This runs on the GitHub Runner where the AWS CLI is fully available and authenticated
          aws s3 cp "$BACKUP_FILE" "s3://$BACKUP_S3_BUCKET/db-backups/db_backup_$TIMESTAMP.sql" --region "$BACKUP_REGION"
          
          if [ $? -ne 0 ]; then
            echo "Error: Failed to upload database backup to S3."
            exit 1
          fi
          
          echo "Cleaning up local dump file..."
          rm "$BACKUP_FILE"
          
          echo "Database backup completed successfully."

      - name: Sync Primary S3 Bucket to Backup Bucket
        run: |
          echo "Starting S3 bucket sync process..."
          
          # Fetch the source bucket name from AWS Secrets Manager
          SOURCE_BUCKET=$(aws secretsmanager get-secret-value --secret-id "${{ secrets.AWS_SECRET_NAME }}" --region ap-south-1 --query SecretString --output text | jq -r '.AWS_S3_BUCKET_NAME')
          
          if [ -z "$SOURCE_BUCKET" ] || [ "$SOURCE_BUCKET" == "null" ]; then
            echo "Error: Could not retrieve AWS_S3_BUCKET_NAME from secrets manager."
            exit 1
          fi
          
          echo "Syncing S3 bucket $SOURCE_BUCKET to backup bucket ${{ secrets.BACKUP_S3_BUCKET_NAME }}..."
          
          # Sync from Source Bucket to Destination Bucket directly
          # Using --source-region to ensure AWS correctly resolves the primary bucket
          aws s3 sync "s3://$SOURCE_BUCKET" "s3://${{ secrets.BACKUP_S3_BUCKET_NAME }}/s3-backups/" --region "${{ secrets.BACKUP_AWS_REGION }}" --source-region ap-south-1
          
          echo "S3 bucket sync completed successfully."
